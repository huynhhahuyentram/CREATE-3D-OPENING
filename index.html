<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Opening Tool Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
    <canvas id="view"></canvas>

    <div class="panel">
        <div class="row">
            <div class="box">
                <h3>📐 Position</h3>
                <div class="input-list">
                    <div class="input-item">
                        <label>X [mm]</label>
                        <input id="px" type="number" value="0">
                    </div>
                    <div class="input-item">
                        <label>Y [mm]</label>
                        <input id="py" type="number" value="0">
                    </div>
                    <div class="input-item">
                        <label>Z [mm]</label>
                        <input id="pz" type="number" value="0">
                    </div>
                </div>
            </div>

            <div class="box">
                <h3>📏 Dimension</h3>
                <div class="input-list">
                    <div class="input-item">
                        <label>Length [mm]</label>
                        <input id="dx" type="number" value="0">
                    </div>
                    <div class="input-item">
                        <label>Width [mm]</label>
                        <input id="dy" type="number" value="0">
                    </div>
                    <div class="input-item">
                        <label>Height [mm]</label>
                        <input id="dz" type="number" value="0">
                    </div>
                </div>
            </div>
        </div>

        <div class="box">
            <h3>🔘 Corner Radius (mm)</h3>
            <div class="radius">
                <label>R1<input id="r1" type="number" value="150"></label>
                <label>R2<input id="r2" type="number" value="150"></label>
                <label>R3<input id="r3" type="number" value="150"></label>
                <label>R4<input id="r4" type="number" value="150"></label>
            </div>
        </div>

        <div class="box">
            <h3>🧭 Orientation</h3>
            <div class="ori">
                <button onclick="setOri('X')" id="ox">X</button>
                <button onclick="setOri('Y')" id="oy">Y</button>
                <button onclick="setOri('Z')" id="oz" class="active">Z</button>
            </div>
        </div>

        <div class="btns">
            <button class="export" onclick="saveFile()">📤 Export</button>
            <button class="voice" onclick="voice()" id="voiceBtn">🎤 Voice</button>
            <button class="reset" onclick="reset()">🔄 Reset</button>
            <button class="library" onclick="openLibraryModal()">📚 Library</button>
            <button class="help" onclick="help()">❓ Help</button>
        </div>

        <div id="chat">
            <div><span class="status-dot green"></span>Ready</div>
        </div>
    </div>
</div>

<!-- DOCUMENT LIBRARY MODAL MODIFIED TO MATCH IMAGE DESIGN -->
<div id="libraryModal" class="modal-overlay">
    <div class="modal-content modal-lib-layout">
        <input type="hidden" id="editingDocId" value="">

        <!-- Modal Header -->
        <div class="modal-header">
            <h2>📚 LIBRARY</h2>
            <button class="close-btn" onclick="closeLibraryModal()">&times;</button>
        </div>

        <!-- Alert Status Bar -->
        <div class="status-alert-green">
            <div class="status-left">
                <span class="check-box">✓</span>
                <span id="docCountText">Loaded 0 documents</span>
            </div>
            <button class="btn-refresh" onclick="refreshDocs()">🔄 Refresh</button>
        </div>

        <!-- Main Grid: Sidebar + Main Content -->
        <div class="lib-body-grid">
            <!-- Left Sidebar -->
            <div class="lib-sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-title">📁 CATEGORIES</div>
                    <button class="nav-item active" data-filter-type="cat" data-filter-val="all" onclick="setFilter('cat', 'all', this)">
                        <span class="nav-icon">📄</span>
                        <span class="nav-text">All Documents</span>
                        <span class="badge" id="badge-cat-all">0</span>
                    </button>
                    <button class="nav-item" data-filter-type="cat" data-filter-val="standards" onclick="setFilter('cat', 'standards', this)">
                        <span class="nav-icon">📋</span>
                        <span class="nav-text">Rules & Standards</span>
                        <span class="badge" id="badge-cat-standards">0</span>
                    </button>
                    <button class="nav-item" data-filter-type="cat" data-filter-val="methods" onclick="setFilter('cat', 'methods', this)">
                        <span class="nav-icon">🔧</span>
                        <span class="nav-text">Methods</span>
                        <span class="badge" id="badge-cat-methods">0</span>
                    </button>
                    <button class="nav-item" data-filter-type="cat" data-filter-val="experience" onclick="setFilter('cat', 'experience', this)">
                        <span class="nav-icon">💡</span>
                        <span class="nav-text">Experience</span>
                        <span class="badge" id="badge-cat-experience">0</span>
                    </button>
                </div>

                <div class="sidebar-section">
                    <div class="sidebar-title">🏗️ BY DEPARTMENT</div>
                    <button class="nav-item" data-filter-type="dept" data-filter-val="hull" onclick="setFilter('dept', 'hull', this)">
                        <span class="nav-icon">🚢</span>
                        <span class="nav-text">Hull</span>
                        <span class="badge" id="badge-dept-hull">0</span>
                    </button>
                    <button class="nav-item" data-filter-type="dept" data-filter-val="piping" onclick="setFilter('dept', 'piping', this)">
                        <span class="nav-icon">🔧</span>
                        <span class="nav-text">Piping</span>
                        <span class="badge" id="badge-dept-piping">0</span>
                    </button>
                    <button class="nav-item" data-filter-type="dept" data-filter-val="electrical" onclick="setFilter('dept', 'electrical', this)">
                        <span class="nav-icon">⚡</span>
                        <span class="nav-text">Electrical</span>
                        <span class="badge" id="badge-dept-electrical">0</span>
                    </button>
                    <button class="nav-item" data-filter-type="dept" data-filter-val="outfitting" onclick="setFilter('dept', 'outfitting', this)">
                        <span class="nav-icon">🛠️</span>
                        <span class="nav-text">Outfitting</span>
                        <span class="badge" id="badge-dept-outfitting">0</span>
                    </button>
                </div>
            </div>

            <!-- Main Content Area -->
            <div class="lib-main">
                <!-- Search and Add Controls -->
                <div class="lib-toolbar">
                    <div class="search-input-wrapper">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="searchInput" placeholder="Search documents..." onkeyup="filterDocs()">
                    </div>
                    <button class="btn-icon-cyan" onclick="startVoiceSearch()" title="Voice Search">🎤</button>
                    <button class="btn-add-purple" onclick="toggleAddForm()">➕ Add</button>
                </div>

                <!-- Add/Edit Document Collapsible Form -->
                <div class="add-form-card" id="addFormCard" style="display: none;">
                    <input type="text" id="docNameInput" placeholder="Document Name...">
                    <input type="text" id="docLinkInput" placeholder="Drive Link...">
                    <input type="text" id="docTagsInput" placeholder="Tags (comma separated)...">
                    <div class="form-row">
                        <select id="docCategorySelect">
                            <option value="standards">Rules & Standards</option>
                            <option value="methods">Methods</option>
                            <option value="experience">Experience</option>
                            <option value="others" selected>Others</option>
                        </select>
                        <select id="docDepartmentSelect">
                            <option value="hull">Hull</option>
                            <option value="piping">Piping</option>
                            <option value="electrical">Electrical</option>
                            <option value="outfitting">Outfitting</option>
                            <option value="others" selected>Others</option>
                        </select>
                        <button class="btn-save" id="saveDocBtn" onclick="addDocument()">💾 Save</button>
                        <button class="btn-cancel" id="cancelEditBtn" onclick="cancelEdit()">✕ Cancel</button>
                    </div>
                </div>

                <!-- Document List -->
                <div class="doc-list-scroll" id="docList">
                    <!-- Javascript renders items here -->
                </div>
            </div>
        </div>

        <!-- Modal Footer -->
        <div class="modal-footer">
            <button class="btn-close-dark" onclick="closeLibraryModal()">Close</button>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { 
    getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc 
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAbbPaSakecB3z-dqQ3FfhS6prHKICCFeA",
    authDomain: "d-opening-tool.firebaseapp.com",
    projectId: "d-opening-tool",
    storageBucket: "d-opening-tool.firebasestorage.app",
    messagingSenderId: "242030973735",
    appId: "1:242030973735:web:d48715738f5709963e4f02",
    measurementId: "G-M384KGE56Z"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.db = db;
  window.fs = { collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc };
</script>

<script src="script.js"></script>

</body>
</html>
