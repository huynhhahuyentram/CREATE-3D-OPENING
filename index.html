<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Kỹ Thuật & Công Cụ 3D</title>
</head>
<body>

    <!-- THAY THẾ CÁC PHẦN TỬ GIAO DIỆN CỦA BẠN VÀO ĐÂY -->
    <div id="libraryModal">
        <div id="docCountText"></div>
        <input type="text" id="searchInput" placeholder="Tìm kiếm..." oninput="filterDocs()">
        <div id="docList"></div>
    </div>

    <!-- KHỞI TẠO FIREBASE SDK (ĐẶT TRƯỚC SCRIPT CHÍNH) -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { 
        getFirestore, 
        collection, 
        onSnapshot, 
        addDoc, 
        doc, 
        updateDoc, 
        deleteDoc 
      } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

      // ⚠️ ĐÃ SỬA: Hãy thay thế bằng thông số THỰC TẾ lấy từ Firebase Console của bạn
      const firebaseConfig = {
    apiKey: "AIzaSyAbbPaSakecB3z-dqQ3FfhS6prHKICCFeA",
    authDomain: "d-opening-tool.firebaseapp.com",
    projectId: "d-opening-tool",
    storageBucket: "d-opening-tool.firebasestorage.app",
    messagingSenderId: "242030973735",
    appId: "1:242030973735:web:d48715738f5709963e4f02",
    measurementId: "G-M384KGE56Z"
  };
      try {
        // Khởi tạo ứng dụng Firebase
        const app = initializeApp(firebaseConfig);
        
        // Gán các hàm Firestore vào biến toàn cục window để script.js dùng
        window.db = getFirestore(app);
        window.fs = {
          collection,
          onSnapshot,
          addDoc,
          doc,
          updateDoc,
          deleteDoc
        };
        console.log("✅ Firebase SDK initialized successfully!");
      } catch (err) {
        console.error("❌ Lỗi khởi tạo Firebase SDK:", err);
      }
    </script>

    <!-- NHÚNG FILE SCRIPT.JS Ở CUỐI -->
    <script src="script.js"></script>
</body>
</html>
