<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Opening & Library Management</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script>
        // Cấu hình Firebase Config
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        window.db = firebase.firestore();
        window.fs = {
            collection: (db, name) => db.collection(name),
            doc: (db, name, id) => db.collection(name).doc(id),
            onSnapshot: (ref, callback, errCb) => ref.onSnapshot(callback, errCb),
            addDoc: (ref, data) => ref.add(data),
            updateDoc: (ref, data) => ref.update(data),
            deleteDoc: (ref) => ref.delete()
        };
    </script>
</head>
<body>

    <div class="main-layout">
        <!-- Main Panel: Nhập thông số và Vẽ Canvas 3D -->
        <div class="left-panel">
            <h2>3D Model Viewer</h2>
            <div class="canvas-container">
                <canvas id="view" width="800" height="400"></canvas>
            </div>

            <div class="ori-selector">
                <span>Trục Tọa Độ (ORI):</span>
                <button id="oz" class="active" onclick="setOri('Z')">Z</button>
                <button id="ox" onclick="setOri('X')">X</button>
                <button id="oy" onclick="setOri('Y')">Y</button>
            </div>

            <div class="input-grid">
                <div class="input-group"><label>Pos X:</label><input type="number" id="px" value="0"></div>
                <div class="input-group"><label>Pos Y:</label><input type="number" id="py" value="0"></div>
                <div class="input-group"><label>Pos Z:</label><input type="number" id="pz" value="0"></div>
                
                <div class="input-group"><label>Length (L):</label><input type="number" id="dx" value="500"></div>
                <div class="input-group"><label>Width (W):</label><input type="number" id="dy" value="300"></div>
                <div class="input-group"><label>Height (H):</label><input type="number" id="dz" value="200"></div>

                <div class="input-group"><label>R1:</label><input type="number" id="r1" value="150"></div>
                <div class="input-group"><label>R2:</label><input type="number" id="r2" value="150"></div>
                <div class="input-group"><label>R3:</label><input type="number" id="r3" value="150"></div>
                <div class="input-group"><label>R4:</label><input type="number" id="r4" value="150"></div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" onclick="voice()">🎤 Nói Voice NLP</button>
                <button class="btn btn-success" onclick="saveFile()">💾 Xuất File Macro</button>
                <button class="btn btn-secondary" onclick="reset()">🔄 Reset</button>
                <button class="btn btn-info" onclick="openLibraryModal()">📚 Thư Viện</button>
            </div>

            <div id="chat" class="chat-log"></div>
        </div>
    </div>

    <!-- Modal Thư Viện (LIBRARY MODAL) -->
    <div id="libraryModal" class="modal-overlay">
        <div class="modal-container">
            <div class="modal-header">
                <div class="modal-title">
                    <span>📚</span> LIBRARY
                </div>
                <button class="close-icon-btn" onclick="closeLibraryModal()">✕</button>
            </div>

            <div class="modal-body">
                <!-- Sidebar Danh mục bên trái -->
                <div class="library-sidebar">
                    <div class="sidebar-section-title">CATEGORIES</div>
                    <button class="nav-item active" onclick="setFilter('cat', 'all', this)">
                        <span>📄 All Documents</span>
                        <span class="badge" id="badge-cat-all">0</span>
                    </button>
                    <button class="nav-item" onclick="setFilter('cat', 'standards', this)">
                        <span>📋 Rules & Standards</span>
                        <span class="badge" id="badge-cat-standards">0</span>
                    </button>
                    <button class="nav-item" onclick="setFilter('cat', 'methods', this)">
                        <span>🔧 Methods</span>
                        <span class="badge" id="badge-cat-methods">0</span>
                    </button>
                    <button class="nav-item" onclick="setFilter('cat', 'experience', this)">
                        <span>💡 Experience</span>
                        <span class="badge" id="badge-cat-experience">0</span>
                    </button>

                    <div class="sidebar-section-title">BY DEPARTMENT</div>
                    <button class="nav-item" onclick="setFilter('dept', 'hull', this)">
                        <span>🚢 Hull</span>
                        <span class="badge" id="badge-dept-hull">0</span>
                    </button>
                    <button class="nav-item" onclick="setFilter('dept', 'piping', this)">
                        <span>🔧 Piping</span>
                        <span class="badge" id="badge-dept-piping">0</span>
                    </button>
                    <button class="nav-item" onclick="setFilter('dept', 'electrical', this)">
                        <span>⚡ Electrical</span>
                        <span class="badge" id="badge-dept-electrical">0</span>
                    </button>
                    <button class="nav-item" onclick="setFilter('dept', 'outfitting', this)">
                        <span>🛠️ Outfitting</span>
                        <span class="badge" id="badge-dept-outfitting">0</span>
                    </button>
                    <button class="nav-item" onclick="setFilter('dept', 'others', this)">
                        <span>📎 Others</span>
                        <span class="badge" id="badge-dept-others">0</span>
                    </button>

                    <!-- Danh mục TOOLS -->
                    <div class="sidebar-section-title">TOOLS</div>
                    <div class="tool-item-card" onclick="downloadTool()">
                        <div class="tool-info">
                            <span class="tool-icon">🧊</span>
                            <span class="tool-name">3D Opening Tool</span>
                        </div>
                        <button class="btn-download-icon" title="Download Tool">↓</button>
                    </div>
                    <div class="tool-sub-text">Click to download tool</div>
                </div>

                <!-- Nội dung danh sách tài liệu bên phải -->
                <div class="library-content">
                    <div class="status-bar">
                        <div class="status-text">
                            <span class="check-icon">✓</span>
                            <span id="docCountText">Loaded 0 documents</span>
                        </div>
                        <button class="btn-refresh" onclick="refreshDocs()">🔄 Refresh</button>
                    </div>

                    <div class="toolbar">
                        <div class="search-box">
                            <span class="search-icon">🔍</span>
                            <input type="text" id="searchInput" placeholder="Search documents..." oninput="filterDocs()">
                        </div>
                        <button class="btn-voice-search" onclick="startVoiceSearch()" title="Tìm kiếm bằng giọng nói">🎤</button>
                        <button class="btn-add" onclick="toggleAddForm()">+ Add</button>
                    </div>

                    <!-- Form Thêm/Sửa Tài Liệu (Ẩn mặc định) -->
                    <div id="addFormCard" class="add-form-card" style="display: none;">
                        <input type="hidden" id="editingDocId">
                        <input type="text" id="docNameInput" placeholder="Tên tài liệu..." class="form-control">
                        <input type="text" id="docLinkInput" placeholder="URL Google Drive hoặc đường dẫn..." class="form-control">
                        <input type="text" id="docTagsInput" placeholder="Thẻ tags (phân cách bằng dấu phẩy)..." class="form-control">
                        <div class="form-row">
                            <select id="docCategorySelect" class="form-control">
                                <option value="standards">Rules & Standards</option>
                                <option value="methods">Methods</option>
                                <option value="experience">Experience</option>
                                <option value="others">Others</option>
                            </select>
                            <select id="docDepartmentSelect" class="form-control">
                                <option value="hull">Hull</option>
                                <option value="piping">Piping</option>
                                <option value="electrical">Electrical</option>
                                <option value="outfitting">Outfitting</option>
                                <option value="others">Others</option>
                            </select>
                        </div>
                        <div class="form-actions">
                            <button id="saveDocBtn" class="btn btn-purple" onclick="addDocument()">+ Add</button>
                            <button id="cancelEditBtn" class="btn btn-secondary" onclick="cancelEdit()" style="display: none;">Hủy</button>
                        </div>
                    </div>

                    <!-- Danh sách tài liệu -->
                    <div id="docList" class="doc-list"></div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-close-footer" onclick="closeLibraryModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
